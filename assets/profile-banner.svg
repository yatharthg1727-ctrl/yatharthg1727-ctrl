<svg width="1400" height="430" viewBox="0 0 1400 430" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050816"/>
      <stop offset="0.48" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>

```
<linearGradient id="neon" x1="190" y1="100" x2="1160" y2="350" gradientUnits="userSpaceOnUse">
  <stop stop-color="#8B5CF6"/>
  <stop offset="0.5" stop-color="#22D3EE"/>
  <stop offset="1" stop-color="#EC4899"/>
</linearGradient>

<linearGradient id="text" x1="290" y1="100" x2="980" y2="250" gradientUnits="userSpaceOnUse">
  <stop stop-color="#FFFFFF"/>
  <stop offset="0.48" stop-color="#C4B5FD"/>
  <stop offset="1" stop-color="#67E8F9"/>
</linearGradient>

<radialGradient id="orb1" cx="0" cy="0" r="1"
  gradientUnits="userSpaceOnUse"
  gradientTransform="translate(1160 90) rotate(135) scale(250)">
  <stop stop-color="#8B5CF6" stop-opacity=".42"/>
  <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
</radialGradient>

<radialGradient id="orb2" cx="0" cy="0" r="1"
  gradientUnits="userSpaceOnUse"
  gradientTransform="translate(210 340) rotate(-45) scale(260)">
  <stop stop-color="#06B6D4" stop-opacity=".34"/>
  <stop offset="1" stop-color="#06B6D4" stop-opacity="0"/>
</radialGradient>

<filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
  <feGaussianBlur stdDeviation="8" result="blur"/>
  <feMerge>
    <feMergeNode in="blur"/>
    <feMergeNode in="SourceGraphic"/>
  </feMerge>
</filter>

<pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
  <path d="M38 0H0V38" stroke="#94A3B8" stroke-opacity=".08"/>
</pattern>
```


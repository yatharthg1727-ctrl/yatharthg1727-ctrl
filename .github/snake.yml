name: Generate contribution snake

on:
schedule:
- cron: "17 0 * * *"

workflow_dispatch:

push:
branches:
- main

permissions:
contents: write

jobs:
generate:
runs-on: ubuntu-latest
timeout-minutes: 10

```
steps:

  - name: Checkout repository
    uses: actions/checkout@v6

  - name: Generate snake SVGs
    uses: Platane/snk/svg-only@v3
    with:
      github_user_name: yatharthg1727-ctrl
      outputs: |
        dist/github-contribution-grid-snake.svg
        dist/github-contribution-grid-snake-dark.svg?palette=github-dark

  - name: Publish generated SVGs
    shell: bash
    run: |
      set -e

      mkdir -p /tmp/snake-dist
      cp -R dist/. /tmp/snake-dist/

      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      git switch --orphan snake-output
      git rm -rf . || true

      cp -R /tmp/snake-dist/. .

      git add .

      git commit -m "Update contribution snake" || exit 0

      git push origin snake-output:output --force
```
